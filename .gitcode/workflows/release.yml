# 马来西亚OSINT — 自动构建 APK 并发布到 Gitcode Release
# 触发：推送版本标签 (v*) 或手动触发
name: 构建与发布 APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 Release APK
        run: ./gradlew assembleRelease

      - name: 确定版本号
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0-snapshot" >> $GITHUB_OUTPUT
          fi

      - name: 生成变更日志
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $LAST_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -10)
          fi
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建 Gitcode Release
        uses: softprops/action-gh-release@v2
        with:
          name: "马来西亚OSINT v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 马来西亚OSINT v${{ steps.version.outputs.VERSION }}

            ### 更新内容
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            ### 下载
            点击下方 **app-release.apk** 下载最新版本安装包。

            > **作者：哪吒网络安全的钟智强**
            > **仓库：gitcode.com/ctkqiang_sr/MalaysianOSINTAPP**
            > **GitHub 镜像：github.com/ctkqiang/MalaysianOSINTAPP**

            ### 免责声明
            本应用仅供安全研究与合法授权测试使用。使用者应遵守马来西亚相关法律法规，对自身行为负责。

          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MalaysianOSINT-v${{ steps.version.outputs.VERSION }}
          path: app/build/outputs/apk/release/app-release.apk
