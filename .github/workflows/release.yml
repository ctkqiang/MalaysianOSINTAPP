# MalaysianOSINT — Automated APK Build & GitHub Release
# Triggers: push version tag (v*) or manual dispatch
name: Build & Release APK

on:
  push:
    tags:
      - 'v*'               # e.g. v1.0.0, v1.0.0-beta
  workflow_dispatch:        # manual trigger from Actions tab
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write           # needed to create releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history for changelog

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MALAYSIAOSINT.apk

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0-snapshot" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Get commits since last tag, or last 10 if no previous tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $LAST_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -10)
          fi
          # Escape for GitHub Actions output
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MalaysianOSINT v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ##  MalaysianOSINT v${{ steps.version.outputs.VERSION }}

            ### 更新内容 / Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            ###  下载 / Download
            点击下方 **MALAYSIAOSINT.apk** 下载最新版本。

            > 作者：哪吒网络安全的钟智强
            > 仓库：github.com/ctkqiang/MalaysianOSINTAPP

          files: app/build/outputs/apk/release/MALAYSIAOSINT.apk
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MalaysianOSINT-v${{ steps.version.outputs.VERSION }}
          path: app/build/outputs/apk/release/MALAYSIAOSINT.apk
